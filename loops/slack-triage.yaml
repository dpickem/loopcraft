# loops/slack-triage.yaml — L1: the lowest-risk observe loop, built first.
id: slack-triage
name: "Slack triage & summarizer"
description: >-
  Scan everything aimed at me — @mentions, DMs, group DMs, and a configured list
  of high-signal channels — and produce a categorized digest (action / review / FYI).

runtime:
  vendor: codex
  # model omitted -> uses the operator's configured Codex default (portable across
  # hosts). Pin a specific model here only if the loop requires one.
  reasoning_effort: medium

locus: vm
cadence:
  type: cron
  at: "0 9,13,17 * * 1-5"   # 09:00, 13:00, 17:00 on weekdays
tier: observe
budget:
  max_turns: 20
  max_tokens: 300000
  max_runtime: 10m
  max_consecutive_failures: 2

# --- explicit dependencies: validated before the loop runs ---
depends_on:
  apis:  [slack]
  tools: [nv-tools]
  auth:  [nv-tools]
  env:   []
  loops: []

# --- I/O contract: drives ordering + the dependency graph ---
# seen.json is the durable cursor: read at the start of a run, rewritten at the
# end. Declaring it as both input and output makes that state explicit to
# validation and the dependency graph (a self-edge, not a cycle).
inputs:
  - state/slack/seen.json
outputs:
  - state/slack/triage-latest.md
  - state/slack/seen.json
artifacts: []

logic:
  skill: skills/slack-triage/SKILL.md
  verify: "state/slack/triage-latest.md exists and lists >=1 categorized item; state/slack/seen.json updated"

approval:
  required: false            # observe-tier: read-only, no approval needed
