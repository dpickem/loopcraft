[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcraft"
version = "0.1.0"
description = "Local intelligence workflows for loopcraft."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Pickem" }]
dependencies = []

[project.scripts]
loopcraft-x-intel = "loopcraft.x_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

