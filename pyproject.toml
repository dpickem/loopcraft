[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcraft"
version = "0.1.0"
description = "Local intelligence workflows for loopcraft."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Pickem" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
loopctl = "loopcraft.cli:main"
loopcraft-x-intel = "loopcraft.research_intel.x.cli:main"
loopcraft-arxiv-intel = "loopcraft.research_intel.arxiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
