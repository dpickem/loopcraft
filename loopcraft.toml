# Loopcraft control-plane configuration.
#
# Wires the SOURCE tree (this repo: code, manifests, skills) to the MEMORY
# tree (the operator-specific ledger + artifact store). The two are different
# git repos with different lifecycles; this file is the only link between them.

# Default runtime adapter for loops that don't pin `runtime.vendor`.
default_vendor = "codex"

# Where the fleet runs by default (informational in M1; used by the scheduler in M2).
host = "vm"

# The MEMORY tree: holds ledger/ (the memory spine), artifacts/, and loopcraft.db.
# Override at runtime with the LOOPCRAFT_MEMORY environment variable.
memory_path = "~/workspace/loopcraft_memory"

# Per-loop scratch worktree retention. Run records and durable outputs stay in
# ledger/; only <memory>/var/worktrees/<loop>/<run_id>/ scratch dirs are pruned.
# Override with LOOPCRAFT_WORKTREE_KEEP_LAST. Clamped to 0..100.
worktree_keep_last = 100

# Optional: offload large/binary artifacts to an external object store.
# artifact_store = "s3://..."

# Scheduler (M2): how `loopctl apply` renders + installs systemd units on the
# host. These are per-host operational choices and never affect loop semantics,
# so they live here rather than in the loop manifests. All fields are optional.
[scheduler]
# Command the rendered service runs (ExecStart). Prefer an absolute path on a
# hardened host so the unit does not depend on PATH.
# loopctl_bin = "/usr/local/bin/loopctl"

# Filename prefix for every rendered unit (loop-<id>.timer / .service / .path).
# unit_prefix = "loop-"

# Which systemd manager owns the units: "system" (/etc/systemd/system, root) or
# "user" (~/.config/systemd/user, no root but needs a lingering login session).
# scope = "system"

# User= for system-scope services (ignored for user scope). Lets the fleet run
# as a dedicated unprivileged account.
# user = "loopcraft"

# EnvironmentFile= holding the host's secrets. Per the security model this lives
# OUTSIDE both git trees, with locked-down permissions; manifests reference
# credential names, never values.
# environment_file = "/etc/loopcraft/loopcraft.env"

# PATH the scheduled service runs with. A systemd unit does not inherit your
# interactive shell PATH, so set this to include the dirs holding `codex`,
# `nv-tools`, and any declared tool binaries for the service user. When set it is
# rendered as `Environment=PATH=` and `apply` resolves runtime/tool binaries
# against it; when unset, systemd's default service PATH is used for both.
# path = "/opt/loopcraft/bin:/usr/local/bin:/usr/bin:/bin"
